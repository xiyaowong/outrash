# Release: a pushed v* tag builds every target and attaches the artifacts to
# the release. Cross-compiles from one Linux runner; the Windows resource
# object is regenerated first so the binary's version block names the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Stamp the version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
          OUTRASH_VERSION="$VERSION" go run ./assets/genicon

      # The packaged forms, mygo build cross-compiled from this runner: the
      # Windows plain binary and its NSIS installer (makensis from apt; mygo
      # downloads NSIS only on Windows), the .app bundles for macOS, and a
      # deb plus an installable tarball for Linux. Signing and disk images
      # are the parts that need macOS, so the bundles ship unsigned.
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sudo apt-get update -y && sudo apt-get install -y nsis
          go tool mygo build -skip-dmg -o out/pack \
            -platform windows/amd64,darwin/amd64,darwin/arm64,linux/amd64,linux/arm64
          cp out/pack/windows-amd64/outrash.exe out/outrash-$VERSION-windows-amd64.exe
          cp "out/pack/windows-amd64/outrash Setup $VERSION amd64.exe" out/
          for d in out/pack/darwin-*; do
            arch=${d##*/darwin-}
            (cd "$d" && zip -qry "../../outrash-$VERSION-darwin-$arch.app.zip" outrash.app)
          done
          cp out/pack/linux-*/outrash_*.deb out/pack/linux-*/outrash-*.tar.gz out/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
