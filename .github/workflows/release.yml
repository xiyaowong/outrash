# Release: a pushed v* tag builds every target and attaches the artifacts to
# the release. Cross-compiles from one Linux runner; the Windows resource
# object is regenerated first so the binary's version block names the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUTRASH_VERSION="$VERSION" go run ./assets/genicon
          mkdir -p out
          build() {
            local os=$1 arch=$2 ext=$3 flags="-s -w"
            [ "$os" = windows ] && flags="$flags -H=windowsgui"
            local name="outrash-$VERSION-$os-$arch"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -buildvcs=false -ldflags "$flags" -o "out/$name$ext" .
            (cd out && zip -q "$name.zip" "$name$ext")
          }
          build windows amd64 .exe
          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""

          # UPX variants alongside the plain ones, at the packer's default
          # level: a balance of ratio and speed. Mach-O is not a format UPX
          # packs, so macOS gets the plain binaries only.
          command -v upx >/dev/null || sudo apt-get install -y -qq upx-ucl
          pack() {
            local name="outrash-$VERSION-$1-$2"
            cp "out/$name$3" "out/$name-upx$3"
            upx -q "out/$name-upx$3"
            (cd out && zip -q "$name-upx.zip" "$name-upx$3")
          }
          pack windows amd64 .exe
          pack linux amd64 ""
          pack linux arm64 ""

      # The packaged forms on top of the plain binaries: a .app bundle for
      # macOS, a deb and an installable tarball for Linux. mygo build
      # cross-compiles them from this runner; signing and disk images are the
      # parts that need macOS, so the bundle ships unsigned.
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' mygo.json > mygo.json.tmp && mv mygo.json.tmp mygo.json
          go tool mygo build -skip-dmg -o out/pack \
            -platform darwin/amd64,darwin/arm64,linux/amd64,linux/arm64
          for d in out/pack/darwin-*; do
            arch=${d##*/darwin-}
            (cd "$d" && zip -qry "../../outrash-$VERSION-darwin-$arch.app.zip" outrash.app)
          done
          cp out/pack/linux-*/outrash_*.deb out/pack/linux-*/outrash-*.tar.gz out/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
